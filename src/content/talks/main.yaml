items:
  - id: 20261106-ai-agents
    title: AI Agents for Astronomical Research
    date: 2026-11-06
    venue: Invited talks on group meetings at ARI/ZAH (8 Oct 2026) and ITA/ZAH (6 Nov 2026), Heidelberg
    summary: >-
      AI agents are language models that can read files, run code and query archives on their own.
      Where do they already do real research work, and where do they still fail? Why does the same model
      do far more as an agent than in a web chat? How do you brief one, and where does the human check belong?
      The slides include two recorded demos: checking references against NASA ADS, and analysing an N-body run on JUPITER.
